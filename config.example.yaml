owner_open_id: ou_xxxxxxxxxxxxxxxx
default_repo: agent
default_runtime: codex

repos:
  agent: /Users/you/Code/feishu-agent-remote
  app: /Users/you/Code/my-app
  infra: /Users/you/Code/my-infra

authorized_open_ids:
  - ou_xxxxxxxxxxxxxxxx

lark_cli_bin: lark-cli
bot_names:
  - your-bot-name

runtimes:
  codex:
    type: codex
    bin: codex
    profile: null
    sandbox: workspace-write
  claude:
    type: claude
    bin: claude
    permission_mode: acceptEdits

agent_templates:
  reviewer:
    runtime: codex
    description: Review diffs and identify risks.
    prompt: |
      请作为代码审查线上专员工作。优先指出 bug、行为回归、风险和缺失测试。任务：${task}
  implementer:
    runtime: codex
    description: Implement and verify a concrete task.
    prompt: |
      请作为实现型线上专员工作。完成任务并运行必要验证。任务：${task}
  reporter:
    runtime: codex
    description: Summarize progress without modifying files.
    prompt: |
      请总结当前 repo/session 的目标、已完成工作、验证状态、风险和下一步。不要修改文件。任务：${task}
